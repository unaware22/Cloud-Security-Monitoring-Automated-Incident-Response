<!-- Wazuh Agent localfile configuration for NexusVault E-Commerce Security Logs -->
<ossec_config>
  <!-- 1. Security Event JSON Lines Log Stream -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/www/ecommerce/logs/security_events.log</location>
    <label key="app_name">nexusvault-ecommerce</label>
    <label key="log_type">security_event</label>
  </localfile>

  <!-- 2. HTTP Request Access Log Stream -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/www/ecommerce/logs/access.log</location>
    <label key="app_name">nexusvault-ecommerce</label>
    <label key="log_type">http_access</label>
  </localfile>

  <!-- 3. Nginx Access & Error Logs -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>

  <!-- 4. System Auth Log -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
</ossec_config>
