# Nginx reverse proxy for the Docker-based AWS web application deployment.
# Install as /etc/nginx/sites-available/ecommerce-skripsi.

limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=checkout_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

log_format json_analytics escape=json
  '{"time_local":"$time_local",'
  '"client_ip":"$remote_addr",'
  '"request":"$request",'
  '"status":"$status",'
  '"request_time":"$request_time",'
  '"http_user_agent":"$http_user_agent",'
  '"http_x_forwarded_for":"$http_x_forwarded_for"}';

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.json.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(env|git|aws|svn|DS_Store) {
        deny all;
        return 404;
    }

    location ~ /(wp-admin|phpmyadmin|pma|backup\.(zip|sql|tar)) {
        deny all;
        return 404;
    }

    location /api/admin/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/orders {
        limit_req zone=checkout_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
