# Nginx Configuration for AWS EC2 Web App (Production)
# /etc/nginx/sites-available/nexusvault

# 1. Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=checkout_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# 2. JSON Access Log Format for Wazuh Agent
log_format json_analytics escape=json
  '{"time_local":"$time_local",'
  '"client_ip":"$remote_addr",'
  '"remote_user":"$remote_user",'
  '"request":"$request",'
  '"status":"$status",'
  '"body_bytes_sent":"$body_bytes_sent",'
  '"request_time":"$request_time",'
  '"http_referrer":"$http_referer",'
  '"http_user_agent":"$http_user_agent",'
  '"http_x_forwarded_for":"$http_x_forwarded_for"}';

server {
    listen 80;
    server_name store.yourdomain.com;

    # Redirect all HTTP traffic to HTTPS in production
    # return 301 https://$host$request_uri;

    # Logging
    access_log /var/log/nginx/access.json.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block sensitive hidden files & scanners
    location ~ /\.(env|git|aws|svn|DS_Store) {
        deny all;
        return 404;
    }

    location ~ /(wp-admin|phpmyadmin|pma|backup\.(zip|sql|tar)) {
        deny all;
        return 404;
    }

    # Public Next.js Static Files
    location /_next/static/ {
        alias /var/www/ecommerce/.next/static/;
        expires 365d;
        access_log off;
    }

    # Admin Login Rate Limiting
    location /api/admin/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Checkout API Rate Limiting
    location /api/orders {
        limit_req zone=checkout_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default Proxy Pass to Next.js Application
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
